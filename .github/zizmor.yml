# Zizmor configuration for workflow security auditing.
# Every relaxation is narrowed to the exact file (and line where the file is
# maintained) with its rationale.
rules:
  dangerous-triggers:
    # Design spec §5.2 deliberately uses workflow_run: the verifier must run
    # from main, never checks out or executes PR code, and never downloads PR
    # artifacts. The write credential lives only in the environment-gated merge
    # job, after the read-only verify job has passed.
    ignore:
      - automerge.yml:14

  dependabot-cooldown:
    # Design spec §5.1/§5.3 intentionally uses a 3-day cooldown for Go module
    # patch updates (minor=7d, major=30d; docker/pip/github-actions=7d).
    ignore:
      - dependabot.yml:9
      - dependabot.yml:24
      - dependabot.yml:43

  self-repository:
    # actionlint v1.7.12 rejects the newer "$/..." syntax and requires "./..."
    # for local composite actions and reusable workflows.
    ignore:
      - ci.yml:246
      - docker-publish.yml:127
      - pull-request.yml:17
      - push-main.yml:14
      - push-main.yml:27
      - release-tag.yml:50
      - release-tag.yml:67
      - release.yml:49
      - release.yml:150
      - release.yml:184
      - release.yml:218
      - scheduled-release.yml:45
      - scheduled-release.yml:80
      - scheduled-release.yml:97
