name: Publish Docker image (trusted)

on:
  workflow_call:
    inputs:
      ref:
        description: Exact Git commit SHA to build and publish
        type: string
        required: true
      tag:
        description: Release version tag (not enabled until PR 5; must be empty in PR 3)
        type: string
        required: false
        default: ''
      push_latest:
        description: Also advance :latest tag (not enabled until PR 5; must be false in PR 3)
        type: boolean
        required: false
        default: false
      disable_cache:
        description: Disable Docker build cache
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Reject version tag and latest publishing until PR 5
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            echo "error: docker-publish.yml 'tag' input is not enabled until PR 5 (got '$INPUT_TAG')" >&2
            exit 1
          fi
          if [ "$INPUT_PUSH_LATEST" = "true" ]; then
            echo "error: docker-publish.yml 'push_latest' is not enabled until PR 5" >&2
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$(git describe --tags --always)"
          revision="$(git rev-parse HEAD)"
          {
            echo "image=${image}"
            echo "tags=${image}:latest-dev"
            echo "version=${version}"
            echo "revision=${revision}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: ./.github/actions/docker-build
        with:
          push: 'true'
          tags: ${{ steps.meta.outputs.tags }}
          version: ${{ steps.meta.outputs.version }}
          revision: ${{ steps.meta.outputs.revision }}
          disable_cache: ${{ inputs.disable_cache }}

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
