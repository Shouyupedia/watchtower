name: Publish Docker image (trusted)

on:
  workflow_call:
    inputs:
      ref:
        description: Exact Git commit SHA to build and publish
        type: string
        required: true
      tag:
        description: Formal release tag, or empty for latest-dev
        type: string
        required: false
        default: ''
      push_latest:
        description: Allow promotion of the published formal release to latest
        type: boolean
        required: false
        default: false
      disable_cache:
        description: Disable Docker build cache
        type: boolean
        required: false
        default: true
      operation:
        description: dev, stage, version, or latest
        type: string
        default: dev
      release_digest:
        description: Attested image digest already reserved by the release writer
        type: string
        default: ''
    outputs:
      digest:
        value: ${{ jobs.publish.outputs.digest }}
      promoted:
        value: ${{ jobs.release-tags.outputs.promoted }}

permissions: {}

jobs:
  publish:
    name: Build, push by digest, and attest
    if: inputs.operation == 'dev' || inputs.operation == 'stage'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      revision: ${{ steps.meta.outputs.revision }}
      digest: ${{ steps.build.outputs.digest || inputs.release_digest }}
    steps:
      - name: Validate development publication inputs
        if: inputs.operation == 'dev'
        env:
          TAG: ${{ inputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
          DIGEST: ${{ inputs.release_digest }}
        run: test -z "$TAG" && test "$PUSH_LATEST" = false && test -z "$DIGEST"

      - name: Checkout release scripts at the workflow revision
        if: inputs.operation == 'stage'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: ${{ inputs.operation == 'stage' && 'release-source' || '.' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compute image metadata
        id: meta
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.operation == 'stage' && 'release-source' || '.' }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG:-$(git -C "$SOURCE" describe --tags --always)}"
          revision="$(git -C "$SOURCE" rev-parse HEAD)"
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "revision=${revision}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the version tag and any recorded image digest
        if: inputs.operation == 'stage'
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.ref }}
          DIGEST: ${{ inputs.release_digest }}
        run: python -IB .github/scripts/release_image.py stage --tag "$TAG" --sha "$SHA" --digest "$DIGEST"

      - name: Check the image attestation source before building
        if: steps.stage.outputs.build == 'true'
        env:
          SOURCE_SHA: ${{ inputs.ref }}
        run: |
          if [ "$GITHUB_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Cannot build and attest the image at $SOURCE_SHA with run SHA $GITHUB_SHA. Re-run the original workflow for $SOURCE_SHA."
            exit 1
          fi

      - name: Build and push image by digest
        if: inputs.operation == 'dev' || steps.stage.outputs.build == 'true'
        id: build
        uses: ./.github/actions/docker-build
        with:
          push_by_digest: 'true'
          image: ${{ steps.meta.outputs.image }}
          version: ${{ steps.meta.outputs.version }}
          revision: ${{ steps.meta.outputs.revision }}
          context: ${{ inputs.operation == 'stage' && './release-source' || '.' }}
          dockerfile: ${{ inputs.operation == 'stage' && './release-source/dockerfiles/Dockerfile' || 'dockerfiles/Dockerfile' }}
          disable_cache: ${{ inputs.operation != 'dev' || inputs.disable_cache }}

      - name: Verify pushed digest
        if: steps.build.outcome == 'success'
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "error: unexpected image digest '${DIGEST}'" >&2
            exit 1
          fi

      - name: Attest image build provenance
        if: steps.build.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  promote-latest-dev:
    name: Promote latest-dev tag
    needs: publish
    if: inputs.operation == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check that candidate SHA is still main tip
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ needs.publish.outputs.revision }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: unexpected candidate SHA '${CANDIDATE_SHA}'" >&2
            exit 1
          fi
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: failed to resolve remote main SHA (got '${main_sha}')" >&2
            exit 1
          fi
          if [ "$main_sha" != "$CANDIDATE_SHA" ]; then
            echo "Skipping :latest-dev promotion: remote main is at ${main_sha}, candidate is ${CANDIDATE_SHA}"
            echo "should_promote=false" >> "$GITHUB_OUTPUT"
          else
            echo "Remote main matches candidate ${CANDIDATE_SHA}; promoting :latest-dev"
            echo "should_promote=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.check.outputs.should_promote == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote attested digest to latest-dev
        if: steps.check.outputs.should_promote == 'true'
        shell: bash
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "error: unexpected image digest '${DIGEST}'" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE}:latest-dev" "${IMAGE}@${DIGEST}"

  release-tags:
    if: inputs.operation == 'version' || inputs.operation == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: read
    outputs:
      promoted: ${{ steps.assign.outputs.promoted }}
    steps:
      - name: Checkout release scripts at the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assign the recorded digest
        id: assign
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.ref }}
          DIGEST: ${{ inputs.release_digest }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = latest ]; then
            test "$PUSH_LATEST" = true
          fi
          python -IB .github/scripts/release_image.py "$OPERATION" --tag "$TAG" --sha "$SHA" --digest "$DIGEST"
