name: Automerge

# Trusted automerge for allow-listed maintenance PRs.
#
# This workflow runs from the default branch via workflow_run and never checks
# out or executes pull request code, and never downloads artifacts. The verify
# job re-derives every fact it needs from the GitHub API and the upstream
# registries (see .github/scripts/automerge_verify.py) and fails closed: any
# missing or unexpected evidence produces eligible=false. Only the merge job,
# bound to the automerge environment, ever holds the watchtower-automerge App
# token.

on:
  workflow_run:
    workflows:
      - Pull Request
      - CodeQL
    types:
      - completed

permissions: {}

concurrency:
  # Serialize decisions per target PR branch. Never cancel a run that may be
  # in the middle of a merge; a newer completion simply queues behind it.
  group: automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify automerge eligibility
    # Only pull_request runs can be evidence for a PR; CodeQL push/schedule
    # runs are ignored. The verifier repeats and tightens every one of these
    # checks, so this condition only avoids pointless jobs.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      eligible: ${{ steps.verify.outputs.eligible }}
      pr_number: ${{ steps.verify.outputs.pr_number }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
    steps:
      # Trusted code only: the default branch, never the pull request head.
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Verify automerge eligibility
        id: verify
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The verifier reads the event payload from GITHUB_EVENT_PATH and
          # treats every value in it as untrusted input to cross-check.
          python -I .github/scripts/automerge_verify.py \
            --repo "$REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

  merge:
    name: Merge verified pull request
    needs: verify
    if: needs.verify.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automerge
    # The App installation token is the only credential used here; the job's
    # own GITHUB_TOKEN gets no scopes and nothing is checked out.
    permissions: {}
    steps:
      - name: Mint watchtower-automerge token
        id: automerge-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge pinned head SHA
        shell: bash
        env:
          GH_TOKEN: ${{ steps.automerge-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.verify.outputs.pr_number }}
          HEAD_SHA: ${{ needs.verify.outputs.head_sha }}
        run: |
          set -euo pipefail

          # Defense in depth: re-validate the values used in an API path or
          # request body before they are passed to gh.
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "refusing to merge: invalid repository" >&2
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "refusing to merge: invalid pull request number" >&2
            exit 1
          fi
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "refusing to merge: invalid head SHA" >&2
            exit 1
          fi

          # One request, guarded by the verified head SHA: GitHub refuses the
          # merge (409) if the head moved after verification. No update-branch
          # call and no retry; a stale branch is left to its updater.
          err_file="$(mktemp)"
          rc=0
          response="$(
            gh api --include -X PUT "repos/${REPOSITORY}/pulls/${PR_NUMBER}/merge" \
              -f sha="$HEAD_SHA" \
              -f merge_method=merge 2>"$err_file"
          )" || rc=$?
          http_status="$(printf '%s\n' "$response" | sed -n '1s#^HTTP/[0-9.]* \([0-9][0-9][0-9]\).*#\1#p')"

          if [ "$rc" -eq 0 ] && [ "$http_status" = "200" ]; then
            echo "Merged pull request #${PR_NUMBER} at ${HEAD_SHA}"
            exit 0
          fi

          # Only an actual HTTP 405 (not mergeable now) or 409 (head SHA no
          # longer matches) is an expected, non-retried outcome.
          if [ "$http_status" = "405" ] || [ "$http_status" = "409" ]; then
            echo "Pull request #${PR_NUMBER} was not merged (HTTP ${http_status}); not retrying."
            exit 0
          fi

          echo "merge request failed (exit ${rc}, HTTP status '${http_status}')" >&2
          cat "$err_file" >&2
          exit 1
