name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # build only, to check the image still builds
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)publish, for example v2.0.0'
        required: true
      latest:
        description: 'Also tag the image as latest'
        type: boolean
        default: true

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      # Always build with the Dockerfile from the workflow's own commit, so that
      # older tags can be republished even if their Dockerfile differs.
      - name: Checkout Dockerfile
        uses: actions/checkout@v5
        with:
          path: .ci
          sparse-checkout: dockerfiles/Dockerfile
          sparse-checkout-cone-mode: false
      - name: Compute image tags
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tags="$image:${INPUT_TAG#v}"
            if [ "$INPUT_LATEST" = "true" ]; then tags="$tags,$image:latest"; fi
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags="$image:${GITHUB_REF_NAME#v},$image:latest"
          else
            tags="$image:latest-dev"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .ci/dockerfiles/Dockerfile
          platforms: linux/amd64,linux/386,linux/arm/v6,linux/arm64
          build-args: WATCHTOWER_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' }}
