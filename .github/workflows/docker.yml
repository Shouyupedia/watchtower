name: Publish Docker image (tag)

# Transitional tag-triggered publisher retained until PR 5 integrates
# docker-publish.yml into release.yml. PR builds, main pushes, and manual
# dispatches are handled by ci.yml / push-main.yml / docker-publish.yml.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME#v}"
          {
            echo "tags=${image}:${tag},${image}:latest"
            echo "version=$(git describe --tags --always)"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: ./.github/actions/docker-build
        with:
          push: 'true'
          tags: ${{ steps.meta.outputs.tags }}
          version: ${{ steps.meta.outputs.version }}
          revision: ${{ steps.meta.outputs.revision }}
          disable_cache: 'true'
