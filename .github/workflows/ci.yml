name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Optional Git ref or commit SHA to check out (defaults to event ref)
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Run staticcheck
        run: go tool -modfile=tools/go.mod staticcheck ./...

  test:
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Run tests
        run: go test -v -coverprofile coverage.out -covermode atomic ./...
      - name: Build macOS release binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
        run: |
          set -euo pipefail
          ldflags="-s -w -X github.com/containrrr/watchtower/internal/meta.Version=smoke-test"
          mkdir -p "$RUNNER_TEMP/macos-smoke"
          GOARCH=arm64 go build -ldflags "$ldflags" -o "$RUNNER_TEMP/macos-smoke/watchtower-darwin-arm64" ./main.go
          GOARCH=amd64 go build -ldflags "$ldflags" -o "$RUNNER_TEMP/macos-smoke/watchtower-darwin-amd64" ./main.go
      - name: Verify macOS binary architecture and signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          check_macho() {
            local path="$1" expected="$2" desc
            desc="$(file -b "$path")"
            echo "$path: $desc"
            case "$desc" in
            *"Mach-O 64-bit executable $expected"*) ;;
            *)
              echo "unexpected architecture for $path: $desc" >&2
              exit 1
              ;;
            esac
          }
          check_macho "$RUNNER_TEMP/macos-smoke/watchtower-darwin-arm64" arm64
          check_macho "$RUNNER_TEMP/macos-smoke/watchtower-darwin-amd64" x86_64
          codesign -v "$RUNNER_TEMP/macos-smoke/watchtower-darwin-arm64"
          echo "arm64 ad-hoc code signature verified"
      - name: Run macOS release binaries without Docker
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          echo "runner architecture: $host_arch"
          case "$host_arch" in
          arm64)
            "$RUNNER_TEMP/macos-smoke/watchtower-darwin-arm64" --help > /dev/null
            echo "ran native arm64 binary (--help)"
            if arch -x86_64 /usr/bin/true 2> /dev/null; then
              "$RUNNER_TEMP/macos-smoke/watchtower-darwin-amd64" --help > /dev/null
              echo "ran amd64 binary under Rosetta (--help)"
            else
              echo "Rosetta unavailable; amd64 binary was only build-verified"
            fi
            ;;
          x86_64)
            "$RUNNER_TEMP/macos-smoke/watchtower-darwin-amd64" --help > /dev/null
            echo "ran native amd64 binary (--help)"
            ;;
          *)
            echo "unexpected runner architecture: $host_arch" >&2
            exit 1
            ;;
          esac

  mod-check:
    name: mod-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Verify and check tidy for root module
        run: |
          go mod verify
          go mod tidy -diff
      - name: Verify and check tidy for tools module
        working-directory: tools
        run: |
          go mod verify
          go mod tidy -diff
      - name: Verify and check tidy for actionlint module
        working-directory: tools/actionlint
        run: |
          go mod verify
          go mod tidy -diff

  version-consistency:
    name: version-consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Check Go version consistency
        run: python -I scripts/check-go-version.py

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Run govulncheck across release targets and evaluate gate
        shell: bash
        run: bash scripts/run-govulncheck.sh

  script-tests:
    name: script-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Run Python script unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -I -m unittest discover -s scripts -p "test_*.py" -v
          if [ -d .github/scripts ]; then
            python -I -m unittest discover -s .github/scripts -p "test_*.py" -v
          fi

  goreleaser-snapshot:
    name: goreleaser-snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Build snapshot release
        run: go tool -modfile=tools/go.mod goreleaser release --snapshot --clean
      - name: Verify release contract
        run: bash scripts/check-release-contract.sh dist

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Build multi-arch Docker image (read-only)
        uses: ./.github/actions/docker-build
        with:
          push: 'false'
          version: dev

  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Build tplprev
        run: bash scripts/build-tplprev.sh
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - name: Install docs dependencies
        run: pip install --require-hashes -r docs-requirements.txt
      - name: Build docs (strict)
        run: mkdocs build --strict

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Run actionlint
        run: go tool -modfile=tools/actionlint/go.mod actionlint
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: .github/zizmor-requirements.txt
      - name: Install workflow linters
        run: pip install --require-hashes -r .github/zizmor-requirements.txt
      - name: Run zizmor
        run: zizmor --min-severity low .github/
      - name: Validate Dependabot config
        run: check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
