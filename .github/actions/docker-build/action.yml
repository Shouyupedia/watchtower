name: Build Docker image
description: Build (and optionally push) the multi-arch Watchtower Docker image without QEMU.

inputs:
  push:
    description: Push the built image to the registry
    required: false
    default: 'false'
  tags:
    description: Comma- or newline-separated image tags (required when push is true)
    required: false
    default: ''
  version:
    description: Value for WATCHTOWER_VERSION build arg and OCI image.version label
    required: true
  revision:
    description: Git commit SHA for OCI image.revision label
    required: false
    default: ''
  platforms:
    description: Target platforms for buildx
    required: false
    default: 'linux/amd64,linux/386,linux/arm/v6,linux/arm64'
  disable_cache:
    description: Disable Docker build cache (use for trusted releases)
    required: false
    default: 'false'
  dockerfile:
    description: Path to Dockerfile
    required: false
    default: 'dockerfiles/Dockerfile'
  context:
    description: Build context directory
    required: false
    default: '.'

outputs:
  digest:
    description: Digest of the built/pushed image
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and push
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ inputs.tags }}
        no-cache: ${{ inputs.disable_cache == 'true' }}
        sbom: ${{ inputs.push == 'true' }}
        provenance: false
        build-args: |
          WATCHTOWER_VERSION=${{ inputs.version }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.version=${{ inputs.version }}
          org.opencontainers.image.revision=${{ inputs.revision || github.sha }}
