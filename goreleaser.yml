version: 2

project_name: watchtower

builds:
  - main: ./main.go
    binary: watchtower
    env:
      - CGO_ENABLED=0
    # Exactly the six targets shipped in v1.0.0. The matrix form
    # (goos x goarch) would add windows/arm64, which v1.0.0 does not have.
    targets:
      - linux_amd64
      - linux_386
      - linux_arm_6
      - linux_arm64
      - windows_amd64
      - windows_386
    ldflags:
      - -s -w -X github.com/containrrr/watchtower/internal/meta.Version={{.Version}}

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ if eq .Arch "arm" }}armhf{{ else if eq .Arch "arm64" }}arm64v8{{ else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE.md
