build:
  main: ./main.go
  binary: watchtower
  goos:
    - linux
    - windows
  goarch:
    - amd64
    - 386
    - arm
    - arm64
  ignore:
    # the 32-bit windows/arm port was removed in Go 1.26
    - goos: windows
      goarch: arm
  ldflags:
    - -s -w -X github.com/containrrr/watchtower/internal/meta.Version={{.Version}}
archives:
  - 
    name_template: "{{.ProjectName}}_{{.Os}}_{{.Arch}}"
    format: tar.gz
    replacements:
      arm: armhf
      arm64: arm64v8
      amd64: amd64
      386: 386
      darwin: macOS
      linux: linux
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE.md
